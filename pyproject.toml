[project]
name = "customer-event-detection"
version = "0.1.0"
description = "Synthetic customer-event anomaly detection platform (learning/portfolio project). No real customer data, no production claims."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "databricks-sdk>=0.133.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E,F: pyflakes/pycodestyle correctness
# I:   import sorting (replaces isort)
# UP:  flags outdated syntax patterns
# B:   bugbear — catches common real bugs, not just style

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
